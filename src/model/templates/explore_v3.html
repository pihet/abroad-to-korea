<title>닮은꼴 국내 여행지</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 사진이 주인공. ① 상단 고정 바(로고·검색) + 분위기 칩 → 사진 격자 갤러리
   ② 결과: 제목 · 조건 칩 · 1위(해외|국내 사진 크게 나란히) · 2위부터 사진 짝 카드. 흰 바탕, 짙은 글자, 청록 포인트 하나 */
:root{
  --bg:#ffffff; --soft:#f6f7f7; --ink:#1f2321; --sub:#6b716e; --line:#e8eae9;
  --accent:#0b7d73; --accent-ink:#ffffff; --accent-soft:#e5f3f1; --warm:#b4532a; --warm-soft:#fbede5;
  --shadow:0 6px 20px rgba(17,24,22,.10); --r-lg:18px; --r:12px;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:clamp(16px,3.4vw,40px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --soft:#1b1f1d; --ink:#eef1ef; --sub:#a3aaa6; --line:#2a302d;
  --accent:#5cc9b8; --accent-ink:#0b1513; --accent-soft:#18302b; --warm:#efa07a; --warm-soft:#36241b;
  --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --soft:#1b1f1d; --ink:#eef1ef; --sub:#a3aaa6; --line:#2a302d;
  --accent:#5cc9b8; --accent-ink:#0b1513; --accent-soft:#18302b; --warm:#efa07a; --warm-soft:#36241b;
  --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:12px var(--gut);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:6px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}
.logo small{font-weight:500;font-size:12px;color:var(--sub);letter-spacing:0}
.search{flex:1 1 280px;max-width:460px;margin-inline:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:999px;padding:9px 18px;box-shadow:0 2px 10px rgba(17,24,22,.06);background:var(--bg)}
.search input{all:unset;flex:1;font-size:14px;min-width:0}
.search svg{flex:0 0 auto;color:var(--sub)}
.beta{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:22px 64px;display:flex;flex-direction:column;gap:22px}
/* 갤러리 */
.hello h1{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--sub);max-width:60ch}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats button,.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 15px;font-size:14px;cursor:pointer;white-space:nowrap}
.cats button:hover,.chips button:hover{border-color:var(--ink)}
.cats button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 20px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile .ph{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;transition:box-shadow .2s}
.tile:hover .ph{box-shadow:var(--shadow)}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--sub);margin-top:-6px}
.pic{display:block;width:100%;height:100%}
.empty{color:var(--sub)}
/* 결과 */
.back{all:unset;cursor:pointer;font-size:14px;color:var(--sub);display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.rtitle h1{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.rtitle p{margin:6px 0 0;color:var(--sub);font-size:14px}
.controls{display:flex;flex-direction:column;gap:12px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.crow>span{font-size:13px;color:var(--sub);min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:6px 14px;font-size:13px}
select{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.why{margin:0;font-size:13px;color:var(--sub)}
/* 사진 짝 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;background:var(--soft);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.tag{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tag.kr{background:var(--accent);color:var(--accent-ink)}
/* 1위 */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(260px,4fr);gap:28px;align-items:start}
.hero .pair{gap:8px}.hero .pair figure{border-radius:var(--r-lg)}
.hero .info{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.best{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;border-radius:999px;padding:4px 12px}
.hero h2{margin:0;font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.hero h2 small,.card h3 small{display:block;font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0;margin-top:4px}
.spot{font-size:14px}.spot b{font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 0}
.fact{background:var(--soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fact dt{font-size:12px;color:var(--sub)}.fact dd{margin:0;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.fact dd small{font-size:12px;font-weight:500;color:var(--sub)}
.fact.on{background:var(--accent-soft)}.fact.on dd{color:var(--accent)}
.fest{font-size:13px;color:var(--warm);background:var(--warm-soft);border-radius:var(--r);padding:8px 12px}
.moved{font-size:12px;color:var(--sub)}
.credit{font-size:11px;color:var(--sub);margin:0}.credit a{text-decoration:underline}
/* 2위부터 */
.sec h2{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:10px}
.card .t{display:flex;align-items:flex-start;gap:10px}
.card .n{flex:0 0 auto;width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.card h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.card .meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.card .meta b{color:var(--ink);font-weight:700}.card .meta .on b{color:var(--accent)}
.more{all:unset;cursor:pointer;align-self:center;border:1px solid var(--ink);border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700}
.more:hover{background:var(--soft)}
footer{border-top:1px solid var(--line);padding-top:16px;color:var(--sub);font-size:12px;display:flex;flex-direction:column;gap:6px;max-width:100ch}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:16px}.list{grid-template-columns:1fr}}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.tile b{font-size:15px}.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="bar"><div class="bar-in">
  <button type="button" class="logo" id="home">닮은꼴<i>.</i><small>해외 풍경을 국내에서</small></button>
  <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="여행지·분위기 검색 (교토, 해변, 설산)" autocomplete="off"></label>
  <span class="beta">프로토타입</span>
</div></header>
<main class="wrap" id="app"></main>
<script>/*DATA*/</script>
<script>
const D = window.DATA, app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRI = [["", "닮은 순"], ["crowd", "덜 붐비게"], ["near", "가깝게"], ["weather", "날씨 좋게"]];
const st = {view: "gallery", q: "", cat: "", place: null, pri: "", interest: "", origin: D.origins[0], more: false};
const R = ri => D.regions[ri];
let clipN = 0;

// 묶음 이미지(WebP)에서 사진 한 장 영역만 보여 준다. 원본 비율 그대로, 자르기·변형 없음.
function pic(src, alt) {
  const m = D.img[src]; if (!m) return "";
  const [s, x, y, w, h] = m, sh = D.sheets[s], id = "c" + (clipN++);
  return `<svg class="pic" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(alt)}">
    <clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>
    <image href="${sh.file}" width="${sh.w}" height="${sh.h}" clip-path="url(#${id})"/></svg>`;
}

// 조건 점수: 빌드 스크립트의 rerank 와 같은 식 (닮음 0.5 + 조건 0.5, 관심사까지면 0.4 / 0.3 / 0.3)
function pct(vals) {
  const ok = Object.values(vals).filter(v => v != null), out = {};
  for (const [k, v] of Object.entries(vals)) out[k] = v == null ? 0.5
    : (ok.filter(x => x < v).length + 0.5 * (ok.filter(x => x === v).length - 1)) / Math.max(1, ok.length - 1);
  return out;
}
function cond(cands, p) {
  const v = {};
  for (const c of cands) { const f = R(c.ri);
    v[c.ri] = p === "crowd" ? (f.congestion == null ? null : -f.congestion)
      : p === "near" ? (f.dist[st.origin] == null ? null : -f.dist[st.origin])
      : p === "weather" ? (f.climate ? f.climate.comfort : null) : f.interest[p]; }
  return pct(v);
}
function rerank(cands) {
  const base = cands.map((c, i) => ({...c, orig: i + 1}));
  if (!st.pri && !st.interest) return base;
  const n = cands.length, a = st.pri ? cond(cands, st.pri) : null, b = st.interest ? cond(cands, st.interest) : null;
  return base.map(c => { const sim = 1 - (c.orig - 1) / (n - 1);
    return {...c, s: a && b ? 0.4 * sim + 0.3 * a[c.ri] + 0.3 * b[c.ri] : 0.5 * sim + 0.5 * (a || b)[c.ri]}; })
    .sort((x, y) => y.s - x.s);
}

const CATS = (() => { const c = {}; D.places.forEach(p => p.tags.forEach(t => c[t] = (c[t] || 0) + 1));
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]); })();

function gallery() {
  const f = st.q.trim().toLowerCase();
  const ps = D.places.filter(p => (!st.cat || p.tags.includes(st.cat)) && (!f || (p.name + " " + p.name_en + " " + p.tags.join(" ")).toLowerCase().includes(f)));
  app.innerHTML = `
    <section class="hello"><h1>어떤 풍경을 국내에서 찾아볼까요?</h1>
      <p>가고 싶은 해외 여행지를 고르면 사진 분위기가 닮은 국내 여행지를 찾아 나란히 보여 드려요.</p></section>
    <nav class="cats" aria-label="분위기">${["", ...CATS].map(t => `<button type="button" data-cat="${esc(t)}" aria-pressed="${st.cat === t}">${t ? esc(t) : "전체"}</button>`).join("")}</nav>
    <section class="grid">${ps.map(p => `<button type="button" class="tile" data-id="${p.id}">
      <div class="ph">${pic(p.photos[0].img, p.name + " 풍경")}</div><b>${esc(p.name)}</b><span>${esc(p.name_en)}</span></button>`).join("")
      || `<p class="empty">${f ? `"${esc(f)}"에 맞는 여행지가 없습니다. 나라 이름이나 분위기(해변, 설산)로 찾아보세요.` : "이 분위기의 여행지가 없습니다."}</p>`}</section>
    ${footer()}`;
}

function factList(f) {
  const cl = f.climate, it = st.interest;
  return [["crowd", "10월 혼잡도", f.congestion == null ? "–" : `${f.congestion}<small> / 평소 100</small>`],
          ["near", `${esc(st.origin)}에서`, f.dist[st.origin] == null ? "–" : `${f.dist[st.origin]}<small> km</small>`],
          ["weather", "10월 날씨", cl ? `${cl.temp}°<small> · 비 ${cl.rain_days}일</small>` : "–"],
          ...(it ? [[it, D.interests[it], `${f.interest[it]}<small> 곳</small>`]] : [])];
}
function pair(p, c, alt) {
  const o = p.photos[c.pair], f = R(c.ri);
  return `<div class="pair">
    <figure>${pic(o.img, `${p.name} ${o.scene}`)}<span class="tag">${esc(p.name)}</span></figure>
    <figure>${pic(c.img, c.title)}<span class="tag kr">${esc(f.name.split(" ").pop())}</span></figure></div>`;
}
function result() {
  const p = st.place, shown = rerank(p.cands).slice(0, 10), [top, ...rest] = shown;
  const label = [st.pri && PRI.find(x => x[0] === st.pri)[1], st.interest && D.interests[st.interest]].filter(Boolean).join(" · ");
  const nm = ri => { const parts = R(ri).name.split(" "), sgg = parts.pop(); return `${esc(sgg)}<small>${esc(parts.join(" "))}</small>`; };
  const moved = c => label && c.orig !== 1 ? `<span class="moved">닮은 순 ${c.orig}위</span>` : "";
  const fest = f => f.n_festivals ? `<div class="fest">10월 축제 ${f.n_festivals}건 · ${f.festivals.map(x => esc(x.title)).join(", ")}</div>` : "";
  const o = p.photos[top.pair], list = st.more ? rest : rest.slice(0, 4);
  app.innerHTML = `
    <button type="button" class="back" id="back">← 다른 풍경 고르기</button>
    <section class="rtitle"><h1>${esc(p.name)}와 닮은 국내 여행지</h1><p>${p.tags.map(esc).join(" · ")}</p></section>
    <section class="controls" aria-label="추천 조건">
      <div class="crow"><span>우선순위</span><div class="chips" id="pri">${PRI.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${st.pri === k}">${l}</button>`).join("")}</div>
        ${st.pri === "near" ? `<select id="origin" aria-label="출발지">${D.origins.map(x => `<option ${x === st.origin ? "selected" : ""}>${x} 출발</option>`).join("")}</select>` : ""}</div>
      <div class="crow"><span>관심사</span><div class="chips" id="int">${[["", "상관없음"], ...Object.entries(D.interests)].map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${st.interest === k}">${l}</button>`).join("")}</div></div>
      <p class="why">${label ? `사진이 닮은 20곳을 ${esc(label)} 조건으로 다시 골랐어요.` : "사진 분위기가 가장 닮은 순서예요. 조건을 고르면 닮은 20곳 안에서 다시 골라 드려요."}</p>
    </section>
    <article class="hero">${pair(p, top)}
      <div class="info"><span class="best">가장 닮은 곳 ${moved(top)}</span><h2>${nm(top.ri)}</h2>
        <div class="spot">가장 닮은 관광지 <b>${esc(top.title)}</b></div>
        <dl class="facts">${factList(R(top.ri)).map(([k, l, v]) => `<div class="fact ${(st.pri === k || st.interest === k) ? "on" : ""}"><dt>${l}</dt><dd>${v}</dd></div>`).join("")}</dl>
        ${fest(R(top.ri))}
        <p class="credit">해외 사진 ${esc(o.artist)} · <a href="${esc(o.license_url)}" target="_blank" rel="noopener">${esc(o.license)}</a> · 국내 사진 한국관광공사 · ${esc(top.kogl)}</p></div></article>
    <section class="sec"><h2>이런 곳도 닮았어요</h2><div class="list">${list.map((c, i) => `<article class="card">${pair(p, c)}
      <div class="t"><span class="n">${i + 2}</span><div><h3>${nm(c.ri)}</h3>
        <div class="meta">${factList(R(c.ri)).map(([k, l, v]) => `<span class="${(st.pri === k || st.interest === k) ? "on" : ""}">${l} <b>${v.replace(/<small>|<\/small>/g, "")}</b></span>`).join("")}</div>
        <div class="meta"><span>${esc(c.title)}</span>${moved(c)}</div></div></div>${fest(R(c.ri))}</article>`).join("")}</div></section>
    ${rest.length > 4 ? `<button type="button" class="more" id="more">${st.more ? "접기" : `${rest.length - 4}곳 더 보기`}</button>` : ""}
    ${footer(p)}`;
}
function footer(p) {
  const credits = p ? `<span>해외 사진: ${p.photos.map(o => `${esc(o.artist)}, <a href="${esc(o.license_url)}" target="_blank" rel="noopener">${esc(o.license)}</a>, <a href="${esc(o.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>`).join(" / ")}</span>` : "";
  return `<footer>${credits}<span>국내 사진: 한국관광공사(공공누리) · 닮음: CLIP 사진 비교 · 혼잡도: 외지인 방문자 월 단위 예측(최근 12개월 평균 = 100) · 날씨: Open-Meteo 2021~2025년 10월 평균 · 거리: 직선거리 · 축제: TourAPI 2026년 10월 · 사진은 비율을 유지해 축소만 했어요.</span></footer>`;
}
function render() { clipN = 0; st.view === "gallery" ? gallery() : result(); }
function go(view) { st.view = view; st.more = false; render(); window.scrollTo(0, 0); }

document.getElementById("home").onclick = () => { st.q = ""; st.cat = ""; document.getElementById("q").value = ""; go("gallery"); };
document.getElementById("q").oninput = e => { st.q = e.target.value; if (st.view !== "gallery") st.view = "gallery"; render(); };
app.addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (t) { st.place = D.places.find(p => p.id === t.dataset.id); go("result"); return; }
  const c = e.target.closest("[data-cat]"); if (c) { st.cat = c.dataset.cat; render(); return; }
  if (e.target.closest("#back")) { go("gallery"); return; }
  if (e.target.closest("#more")) { st.more = !st.more; render(); return; }
  const b = e.target.closest("#pri button, #int button");
  if (b) { if (b.closest("#pri")) st.pri = b.dataset.k; else st.interest = b.dataset.k; render(); }
});
app.addEventListener("change", e => { if (e.target.id === "origin") { st.origin = e.target.value.replace(" 출발", ""); render(); } });
render();
</script>
